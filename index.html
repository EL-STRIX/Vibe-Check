<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>github vibe check</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Theme Toggle (top right corner) -->
  <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark/light theme" type="button">
    <span id="theme-icon" class="theme-icon">🌙</span>
  </button>

  <div class="app-wrapper">
    <!-- Screen 1: Landing -->
    <section id="screen-landing" class="screen screen-landing">
      <div class="landing-content">
        <h1 class="landing-title gradient-text">github vibe check</h1>
        <p class="landing-subtitle">drop your github id, get read.</p>

        <form id="vibe-form" class="landing-form" autocomplete="off" novalidate>
          <div class="input-wrapper">
            <input
              type="text"
              id="username-input"
              class="vibe-input"
              placeholder="github username or profile url"
              spellcheck="false"
              autocorrect="off"
              autocapitalize="none"
              required
            />
          </div>
          <button type="submit" id="submit-btn" class="btn btn-gradient">
            check my vibe
          </button>
        </form>
      </div>
    </section>

    <!-- Screen 2: Loading -->
    <section id="screen-loading" class="screen screen-loading" hidden>
      <div class="loading-content">
        <div class="loading-blob"></div>
        <p id="loading-line" class="loading-text">stalking your commits...</p>
      </div>
    </section>

    <!-- Screen 3: Result (Top to bottom per Spec Section 2) -->
    <section id="screen-result" class="screen screen-result" hidden>
      <div id="result-container" class="result-container">
        <!-- 1. Profile Card -->
        <div id="profile-card" class="vibe-card profile-card">
          <img id="profile-avatar" class="profile-avatar" src="" alt="Avatar" />
          <div class="profile-info">
            <h2 id="profile-name" class="profile-name"></h2>
            <span id="profile-handle" class="profile-handle"></span>
            <p id="profile-bio" class="profile-bio"></p>
          </div>
        </div>

        <!-- 2. Dev Title & Vibe Score Ring Card -->
        <div id="title-score-card" class="vibe-card title-score-card">
          <div class="score-header">
            <div class="score-ring-container">
              <svg class="score-ring-svg" viewBox="0 0 100 100">
                <defs>
                  <linearGradient id="scoreGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#A78BFA" />
                    <stop offset="50%" stop-color="#F472B6" />
                    <stop offset="100%" stop-color="#FB923C" />
                  </linearGradient>
                </defs>
                <circle class="score-ring-bg" cx="50" cy="50" r="42" />
                <circle id="score-ring-circle" class="score-ring-progress" cx="50" cy="50" r="42" />
              </svg>
              <div class="score-ring-inner">
                <span id="score-number" class="score-number gradient-text">0</span>
              </div>
            </div>
            <div class="score-meta">
              <span class="vibe-tag">vibe score</span>
              <span id="score-label" class="score-label">mid but loading</span>
            </div>
          </div>
          <h2 id="dev-title" class="dev-title gradient-text">Quiet Builder</h2>
        </div>

        <!-- 3. Reaction Text (2 to 3 short lines) -->
        <div id="reaction-card" class="vibe-card reaction-card">
          <div id="reaction-lines" class="reaction-lines"></div>
        </div>

        <!-- 4. Stats Row -->
        <div id="stats-grid" class="vibe-card stats-grid">
          <div class="stat-item">
            <span id="stat-repos" class="stat-number">0</span>
            <span class="stat-label">repos</span>
          </div>
          <div class="stat-item">
            <span id="stat-stars" class="stat-number">0</span>
            <span class="stat-label">stars</span>
          </div>
          <div class="stat-item">
            <span id="stat-commits" class="stat-number">0</span>
            <span class="stat-label">commits</span>
          </div>
          <div class="stat-item">
            <span id="stat-prs" class="stat-number">0</span>
            <span class="stat-label">prs</span>
          </div>
          <div class="stat-item">
            <span id="stat-followers" class="stat-number">0</span>
            <span class="stat-label">followers</span>
          </div>
          <div class="stat-item">
            <span id="stat-streak" class="stat-number">0</span>
            <span class="stat-label">streak</span>
          </div>
        </div>

        <!-- 5. Language Bar (top 4 languages, colored) -->
        <div id="language-card" class="vibe-card language-card">
          <h3 class="card-subtitle">top languages ⚡</h3>
          <div id="language-bar" class="language-bar"></div>
          <div id="language-legend" class="language-legend"></div>
        </div>

        <!-- 6. Contribution Heatmap (last 12 months, mini size) -->
        <div id="heatmap-card" class="vibe-card heatmap-card">
          <h3 class="card-subtitle">activity heatmap (12 mos) 📅</h3>
          <div class="heatmap-scroll-wrapper">
            <div id="heatmap-chart" class="heatmap-chart"></div>
          </div>
        </div>

        <!-- 7. Top 2 Repos -->
        <div id="top-repos-card" class="vibe-card top-repos-card">
          <h3 class="card-subtitle">top repositories 📦</h3>
          <div id="repos-list" class="repos-list"></div>
        </div>

        <!-- 8. Badges: small pills (max 4) -->
        <div id="badges-container" class="badges-container"></div>

        <!-- 9. One-line verdict in quotes -->
        <div id="verdict-card" class="vibe-card verdict-card">
          <p id="verdict-text" class="verdict-text"></p>
        </div>

        <!-- 10. Buttons -->
        <div class="action-buttons">
          <button id="try-another-btn" class="btn btn-secondary" type="button">
            try another
          </button>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script>
  <script type="module" src="reactions.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
