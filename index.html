<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>github vibe check</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Theme Toggle (top right corner) -->
  <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark/light theme" type="button">
    <span id="theme-icon" class="theme-icon">🌙</span>
  </button>

  <div class="app-wrapper">
    <!-- Screen 1: Landing -->
    <section id="screen-landing" class="screen screen-landing">
      <div class="landing-content">
        <h1 class="landing-title gradient-text">github vibe check</h1>
        <p class="landing-subtitle">drop your github id, get read.</p>

        <form id="vibe-form" class="landing-form" autocomplete="off" novalidate>
          <div class="input-wrapper">
            <input
              type="text"
              id="username-input"
              class="vibe-input"
              placeholder="github username or profile url"
              spellcheck="false"
              autocorrect="off"
              autocapitalize="none"
              required
            />
          </div>
          <button type="submit" id="submit-btn" class="btn btn-gradient">
            check my vibe
          </button>
        </form>
      </div>
    </section>

    <!-- Screen 2: Loading -->
    <section id="screen-loading" class="screen screen-loading" hidden>
      <div class="loading-content">
        <div class="loading-blob"></div>
        <p id="loading-line" class="loading-text">stalking your commits...</p>
      </div>
    </section>

    <!-- Screen 3: Result -->
    <section id="screen-result" class="screen screen-result" hidden>
      <div id="result-container" class="result-container">
        <!-- 1. Profile Card -->
        <div id="profile-card" class="vibe-card profile-card">
          <img id="profile-avatar" class="profile-avatar" src="" alt="Avatar" />
          <div class="profile-info">
            <h2 id="profile-name" class="profile-name"></h2>
            <span id="profile-handle" class="profile-handle"></span>
            <p id="profile-bio" class="profile-bio"></p>
          </div>
        </div>

        <!-- 2 & 3. Title, Score Ring & Reaction (Phase 4 & 5 placeholders) -->
        <div id="title-score-container" class="title-score-container"></div>
        <div id="reaction-container" class="reaction-container"></div>

        <!-- 4. Stats Row -->
        <div id="stats-grid" class="vibe-card stats-grid">
          <div class="stat-item">
            <span id="stat-repos" class="stat-number">0</span>
            <span class="stat-label">repos</span>
          </div>
          <div class="stat-item">
            <span id="stat-stars" class="stat-number">0</span>
            <span class="stat-label">stars</span>
          </div>
          <div class="stat-item">
            <span id="stat-commits" class="stat-number">0</span>
            <span class="stat-label">commits</span>
          </div>
          <div class="stat-item">
            <span id="stat-prs" class="stat-number">0</span>
            <span class="stat-label">prs</span>
          </div>
          <div class="stat-item">
            <span id="stat-followers" class="stat-number">0</span>
            <span class="stat-label">followers</span>
          </div>
          <div class="stat-item">
            <span id="stat-streak" class="stat-number">0</span>
            <span class="stat-label">streak</span>
          </div>
        </div>

        <!-- 5-9. Visual Extras & Verdict (Phase 4 & 5 placeholders) -->
        <div id="visual-extras-container" class="visual-extras-container"></div>
        <div id="verdict-container" class="verdict-container"></div>

        <!-- 10. Action Buttons -->
        <div class="action-buttons">
          <button id="try-another-btn" class="btn btn-secondary" type="button">
            try another
          </button>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script>
  <script type="module" src="reactions.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
